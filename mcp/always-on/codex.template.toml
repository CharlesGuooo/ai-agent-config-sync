# Codex MCP servers — append to [mcp_servers.*] sections in ~/.codex/config.toml
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"


[mcp_servers.memory]
command = "npx"
args = 
[mcp_servers.filesystem]
command = "npx"
args = 
[mcp_servers.context7]
command = "npx"
args = 
[mcp_servers.sequential-thinking]
command = "npx"
args = 
[mcp_servers.brave-search]
command = "npx"
args = 
[mcp_servers.playwright]
command = "npx"
args = 
[mcp_servers.chrome-devtools]
command = "npx"
args = 
[mcp_servers.web-reader]
# Z.AI endpoint historically incompatible with Codex MCP HTTP client; kept disabled in Codex.
enabled = false
url = "https://api.z.ai/api/mcp/web_reader/mcp"
bearer_token_env_var = "Z_AI_API_KEY"

# ============================================================
# Opt-in MCP Servers (10) — enable per-invocation:
#   codex -c mcp_servers.<name>.enabled=true
# ============================================================


[mcp_servers.zai-mcp-server]
enabled = false
command = "npx"
args = 
[mcp_servers.supabase]
enabled = false
url = "https://mcp.supabase.com/mcp?project_ref=qxgukktwygitluugnijy"
bearer_token_env_var = "SUPABASE_ACCESS_TOKEN"


[mcp_servers.vercel]
enabled = false
url = "https://mcp.vercel.com"


[mcp_servers.railway]
enabled = false
command = "npx"
args = 
[mcp_servers.expo-mcp]
enabled = false
url = "https://mcp.expo.dev/mcp"
bearer_token_env_var = "EXPO_TOKEN"


[mcp_servers.magic]
enabled = false
command = "npx"
args = 
[mcp_servers.cloudflare-docs]
enabled = false
url = "https://docs.mcp.cloudflare.com/mcp"


[mcp_servers.cloudflare-workers-builds]
enabled = false
url = "https://builds.mcp.cloudflare.com/mcp"


[mcp_servers.cloudflare-workers-bindings]
enabled = false
url = "https://bindings.mcp.cloudflare.com/mcp"


[mcp_servers.cloudflare-observability]
enabled = false
url = "https://observability.mcp.cloudflare.com/mcp"

